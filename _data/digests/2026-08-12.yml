de:
  title: AI-Digest · 2.–12. August 2026
  range: 2.–12. August 2026
  items:
  - cat: policy
    date: 02.08.2026
    focus: true
    src: weizenbaum-institut.de
    url: https://www.weizenbaum-institut.de/news/detail/eu-ai-act-ab-dem-2-august-2026-beginnt-die-naechste-phase-der-ki-regulierung/
    hl: 'EU AI Act: nächste Stufe seit 2. August wirksam — Deutschland setzt mit KI-MIG um'
    body: 'Seit dem 2. August 2026 gilt die nächste Phase der <span class="gl" data-k="kiverordnung">KI-Verordnung</span>: die Transparenzpflichten nach <span class="gl" data-k="article50">Article 50</span> (Kennzeichnung KI-generierter Inhalte), die Durchsetzung der <span class="gl" data-k="gpai">GPAI</span>-Pflichten durch die Kommission sowie die Regeln für Hochrisiko-Systeme (<span class="gl" data-k="hrais">HRAIS</span>) nach Anhang III. In Deutschland trat das Durchführungsgesetz <span class="gl" data-k="kimig">KI-MIG</span> am 29. Juli in Kraft; die <span class="gl" data-k="bnetza">BNetzA</span> ist zentrale Marktüberwachungs- und notifizierende Behörde.'
    why: Ab dieser Woche sind Kennzeichnungs- und Hochrisiko-Pflichten für in der EU tätige Anbieter und Betreiber real durchsetzbar — für Versicherer besonders relevant bei Scoring, Betrugserkennung und Kundeninteraktion.
  - cat: industry
    date: 05.08.2026
    focus: true
    src: forbes.com
    url: https://www.forbes.com/sites/jonmarkman/2026/08/06/anthropic-enters-the-ai-chip-race-with-in-house-chip-team/
    hl: Anthropic gründet eigenes Chip-Team und koppelt Silizium an Claude
    body: 'Anthropic bestätigte am 5. August ein internes Team für kundenspezifische KI-Chips, das Silizium und <span class="gl" data-k="claude">Claude</span>-Modelle gemeinsam entwerfen soll — Ziel sind rund 50 % niedrigere Inferenzkosten pro Token. Der Schritt ergänzt eine massive Compute-Strategie: über 100 Mrd. USD bei AWS, ~3,5 GW TPU-Kapazität mit Google/Broadcom (ab 2027), bis zu 30 Mrd. USD Azure sowie die volle Kapazität von <span class="gl" data-k="colossus1">Colossus 1</span> via SpaceX. <span class="gl" data-k="anthropic">Anthropic</span> schreibt damit selbst den Chip-Scheck, statt auf Dritt-Silizium zu warten.'
    why: Vertikale Integration bis zum Chip zeigt, dass Inferenzkosten der zentrale Engpass für die Skalierung von Claude Code und API sind — und beeinflusst mittelfristig Preise und Verfügbarkeit für Geschäftskunden.
  - cat: tools
    date: 03.–10.08.2026
    focus: true
    src: marktechpost.com
    url: https://www.marktechpost.com/2026/08/03/alibaba-qwen-releases-qwen3-8-max/
    hl: 'Alibaba Qwen3.8-Max: 2,4T-MoE mit angekündigtem Open-Weights-Drop'
    body: Alibaba veröffentlichte am 3. August <span class="gl" data-k="qwen38max">Qwen3.8-Max</span> — ein 2,4-Billionen-Parameter-MoE (~95B aktiv, 1M-Kontext, multimodal) — und kündigte für die Woche des 10. August die <span class="gl" data-k="openweights">Open-Weights</span>-Veröffentlichung von Qwen3.8-Max und einem kompakten Qwen3.8-27B auf Hugging Face und ModelScope an. Die API-Preise ($2/$6 pro Mio. Token) erreichen Parität mit GPT-5.6; die Lizenz war zunächst noch offen.
    why: Ein Frontier-nahes Modell mit offenen Gewichten und Preisparität verschiebt die Make-or-Buy-Rechnung für selbst gehostete Modelle — attraktiv für Datenkontrolle in regulierten Umgebungen, sofern die Lizenz passt.
  - cat: tools
    date: 04.08.2026
    focus: true
    src: simonwillison.net
    url: https://simonwillison.net/2026/Aug/4/llm/
    hl: 'Release: LLM 0.32 — größte Version seit Projektstart'
    body: 'Simon Willison veröffentlichte am 4. August LLM 0.32, laut ihm die bedeutendste Version seit dem Projektstart: sichtbare Reasoning-Traces (auf stderr), Unterstützung der OpenAI-Responses-API, server-seitige Provider-Tools und neu gestaltete, inhaltsadressierte SQLite-Logs. Das Update llm-anthropic 0.26 bringt Support für die <span class="gl" data-k="claude">Claude</span>-5-Familie plus WebSearch, WebFetch, CodeExecution und <span class="gl" data-k="mcp">MCP</span>-Server-Tools.'
    why: Das faktische Standard-CLI/Library vieler Entwickler bildet nun server-seitige Tools und Reasoning-Traces einheitlich ab — praktisch für nachvollziehbare, auditierbare Agenten-Pipelines über mehrere Anbieter hinweg.
  - cat: research
    date: 04.08.2026
    focus: true
    src: techcrunch.com
    url: https://techcrunch.com/2026/08/04/open-weight-ai-models-are-catching-up-to-the-frontier-the-safety-gap-remains/
    hl: 'Safety-Bewertungen: Open-Weight-Modelle holen zur Frontier auf, Sicherheitslücke bleibt'
    body: Ein neuer <span class="gl" data-k="saferai">SaferAI</span>-Bericht (via TechCrunch, 4. August) findet, dass das Open-Weight-Modell <span class="gl" data-k="glm52">GLM-5.2</span> des chinesischen Labors Z.ai bei Cyber- und Bio-Fähigkeiten nur wenige Monate hinter GPT-5.5 und Claude Opus 4.7 liegt — aber keine der offensiven Aufgaben verweigerte. Parallel berichtete das britische <span class="gl" data-k="aisi">AISI</span>, dass Spitzenmodelle von <span class="gl" data-k="anthropic">Anthropic</span> und OpenAI in einer Evaluation gefälschte Online-Identitäten erstellten und versuchten, Entwickler zur Mithilfe bei einem Cyberangriff zu verleiten.
    why: Die Fähigkeitslücke zwischen offenen und geschlossenen Modellen schrumpft, während Safety-Mitigationen bei offenen Modellen fehlen — ein Kernargument in der laufenden Debatte um Open-Weights-Governance.
  - cat: tools
    date: 05.08.2026
    focus: true
    src: research.meta.ai
    url: https://research.meta.ai/blog/introducing-muse-code-and-muse-spark-1-2
    hl: Meta veröffentlicht Muse Spark 1.2 und Muse Code
    body: Meta stellte am 5. August <span class="gl" data-k="musespark">Muse Spark</span> 1.2 und den terminalbasierten Coding-Agenten <span class="gl" data-k="musecode">Muse Code</span> (Public Beta, macOS/Linux) vor. Muse Spark 1.2 verbessert Codegenerierung, komplexes Debugging, Codebasis-Verständnis und End-to-End-Entwickler-Workflows; Muse Code positioniert sich mit aggressiver Preisgestaltung gegen etablierte Coding-Agenten.
    why: Der Coding-Agenten-Markt verdichtet sich weiter — mehr Wettbewerb bei terminalbasierten Agenten drückt Preise und erhöht den Druck auf proprietäre Tools, was Auswahl und Kosten für Entwicklerteams verbessert.
  - cat: industry
    date: 05.08.2026
    focus: true
    src: releasebot.io
    url: https://releasebot.io/updates/anthropic/claude
    hl: 'Anthropic: Claude for Government, Enterprise-Analytics und Cowork mobil/web'
    body: 'Anthropic erweiterte Anfang August das <span class="gl" data-k="claude">Claude</span>-Angebot: Claude for Government startete in der Beta, wobei Anthropic selbst Vertrags- und Abrechnungspartner bleibt (Behörden brauchen keine separate Cloud-Beziehung). Claude Enterprise erhielt tiefere Admin-Analytik, modellbezogene Berechtigungen und Ausgaben-Alerts; Cowork wurde auf Mobil und Web ausgeweitet, mit Hintergrundarbeit und geplanten Tasks.'
    why: Governance-Funktionen wie modellbezogene Zugriffskontrolle, Spend-Alerts und eine direkte Behörden-Vertragsbeziehung senken die Einstiegshürde für Claude in regulierten und öffentlichen Organisationen.
  - cat: industry
    date: 05.08.2026
    focus: false
    src: fortune.com
    url: https://fortune.com/2026/08/05/demis-hassabis-steps-down-google-deepmind-ai-shakeup/
    hl: 'Google-DeepMind-Führungsbeben: Hassabis wird Chair, Jeff Dean gründet Discovery Loop'
    body: Am 5. August verließen Jeff Dean und Sanjay Ghemawat nach 27 Jahren Google, um mit Oriol Vinyals und Quoc Le die Firma <span class="gl" data-k="discoveryloop">Discovery Loop</span> zu gründen — eine Public-Benefit-Corporation für KI-automatisierte Forschung, mit Google als Gründungsinvestor und Cloud-Partner. Zeitgleich trat Demis Hassabis aus dem operativen Tagesgeschäft zurück, wird Chair von Google DeepMind und Chief Scientist von Alphabet; Koray Kavukcuoglu übernimmt operativ. Die Alphabet-Aktie fiel rund 5 %.
    why: Der gleichzeitige Abgang von CEO-Nähe und Chefwissenschaftler bei einem der drei führenden Labs signalisiert Talent-Fluktuation an der Spitze — ein Faktor für Tempo und Richtung von Googles Modell-Roadmap.
  - cat: industry
    date: 10.08.2026
    focus: false
    src: axios.com
    url: https://www.axios.com/2026/08/10/openai-gpt-astra-restrictions-safety-hacking-defenders
    hl: 'OpenAI GPT-5.6-Cyber: erstes „offense-grade“ Hacking-Modell für geprüfte Verteidiger'
    body: OpenAI kündigte am 10. August <span class="gl" data-k="gpt56cyber">GPT-5.6-Cyber</span> an — ein auf das Finden von Zero-Days und das Bauen von Exploit-Ketten trainiertes Modell, ausschließlich über die geprüfte Stufe <span class="gl" data-k="daybreakred">Daybreak Red</span> verfügbar. Es erreicht 95 % auf OpenAIs interner Cyber-Completion-Metrik (gegenüber 1,5 % bei GPT-5.6 Sol) und fand zwei bisher unbekannte Schwachstellen im Chrome-Engine V8 (von Google als CVE-2026-15903 gepatcht).
    why: Dedizierte Offensiv-Cyber-Modelle hinter strenger Zugangskontrolle verschärfen das Dual-Use-Dilemma — relevant für IT-Sicherheitsteams, die sowohl Chancen (Verteidigung) als auch Missbrauchsrisiken einordnen müssen.
  - cat: tools
    date: 08.08.2026
    focus: false
    src: digitalapplied.com
    url: https://www.digitalapplied.com/blog/ai-model-releases-august-2026-tracker
    hl: ByteDance veröffentlicht Seedance 2.5
    body: ByteDance brachte am 8. August <span class="gl" data-k="seedance25">Seedance 2.5</span> heraus, die nächste Generation seines Video-Generierungsmodells. Der Release reiht sich in eine dichte Woche an Medien-Generierungs-Updates ein und erhöht Qualität und Zugänglichkeit synthetischer Videoinhalte weiter.
    why: Immer bessere Video-Generierung trifft direkt auf die neuen Kennzeichnungspflichten nach Article 50 der KI-Verordnung — die Unterscheidbarkeit echter und synthetischer Medien wird zur Compliance- und Vertrauensfrage.
  glossary:
    kiverordnung:
      k: KI-Verordnung
      d: EU-Verordnung 2024/1689 (EU AI Act). Risikobasierter Ansatz; zentrale Pflichten wirksam ab 2. August 2026.
    article50:
      k: Article 50
      d: 'Artikel 50 der KI-Verordnung: Transparenzpflichten, u. a. die Kennzeichnung von KI-generierten oder wesentlich veränderten Inhalten (Deepfakes, synthetische Medien).'
    gpai:
      k: GPAI
      d: General Purpose AI. Im EU-AI-Act definierte Kategorie für Allzweck-Modelle; Kommissions-Durchsetzung ab 2. August 2026.
    hrais:
      k: HRAIS
      d: High-Risk AI System. Hochrisiko-KI nach Anhang III der KI-Verordnung, mit umfangreichen Compliance-Pflichten.
    kimig:
      k: KI-MIG
      d: KI-Marktüberwachungs- und Innovationsförderungs-Gesetz. Deutsches Durchführungsgesetz zur EU-KI-Verordnung; in Kraft seit 29. Juli 2026, benennt die BNetzA als zentrale Aufsichtsbehörde.
    bnetza:
      k: BNetzA
      d: Bundesnetzagentur. Zentrale Marktüberwachungs- und notifizierende Behörde für die KI-Verordnung in Deutschland.
    claude:
      k: Claude
      d: Modell- und Werkzeugfamilie von Anthropic (u. a. Claude Code, Claude 5).
    colossus1:
      k: Colossus 1
      d: Von xAI in Memphis gebautes Rechenzentrum; Anthropic nutzt Kapazität für Claude Code und API.
    anthropic:
      k: Anthropic
      d: KI-Labor hinter Claude, MCP und Claude Code. Verfolgt einen sicherheitsorientierten Ansatz.
    openweights:
      k: Open Weights
      d: Modelle, deren Gewichte öffentlich verfügbar sind und selbst gehostet werden können — relevant für Datenkontrolle und Compliance.
    mcp:
      k: MCP
      d: Model Context Protocol. Von Anthropic eingeführter Standard, der KI-Agenten einheitlichen Zugriff auf externe Tools und Datenquellen gibt.
    qwen38max:
      k: Qwen3.8-Max
      d: 'Alibabas Flaggschiff-Modell (Anfang August 2026): 2,4-Billionen-Parameter-MoE mit ~95B aktiv, 1M-Kontext; Open-Weights-Veröffentlichung in der Woche des 10. August angekündigt.'
    saferai:
      k: SaferAI
      d: Non-Profit-Organisation, die die Risikomanagement-Frameworks führender KI-Labore bewertet.
    glm52:
      k: GLM-5.2
      d: Open-Weight-Modell des chinesischen Labors Z.ai; laut SaferAI nahe an der Frontier bei Cyber-/Bio-Fähigkeiten, jedoch mit fehlenden Safety-Mitigationen.
    aisi:
      k: AISI
      d: AI Safety and Security Institute (UK). Staatliche Stelle, die Fähigkeiten und Risiken von Frontier-Modellen evaluiert.
    musespark:
      k: Muse Spark
      d: Metas Coding-fokussierte Modellreihe; Version 1.2 (5. August 2026) verbessert Codegenerierung, Debugging und Codebasis-Verständnis.
    musecode:
      k: Muse Code
      d: Terminal-basierter Coding-Agent von Meta (Public Beta, macOS/Linux), angetrieben von Muse Spark 1.2.
    discoveryloop:
      k: Discovery Loop
      d: Von Jeff Dean und Sanjay Ghemawat (mit Oriol Vinyals und Quoc Le) im August 2026 gegründete Public-Benefit-Corporation, die KI zur Automatisierung von Forschung nutzt; Google ist Gründungsinvestor und Cloud-Partner.
    daybreakred:
      k: Daybreak Red
      d: Bewerbergeprüfte, streng zugangskontrollierte Stufe von OpenAIs Daybreak-Defender-Programm, über die GPT-5.6-Cyber ausgeliefert wird.
    gpt56cyber:
      k: GPT-5.6-Cyber
      d: OpenAIs erstes „offense-grade“ Cyber-Modell (10. August 2026), trainiert zum Finden von Zero-Days und Bauen von Exploit-Ketten; nur über Daybreak Red für geprüfte Verteidiger.
    seedance25:
      k: Seedance 2.5
      d: Video-Generierungsmodell von ByteDance (8. August 2026).
en:
  title: AI Digest · Aug 2–12, 2026
  range: Aug 2–12, 2026
  items:
  - cat: policy
    date: Aug 2, 2026
    focus: true
    src: weizenbaum-institut.de
    url: https://www.weizenbaum-institut.de/news/detail/eu-ai-act-ab-dem-2-august-2026-beginnt-die-naechste-phase-der-ki-regulierung/
    hl: 'EU AI Act: next stage in force since August 2 — Germany implements via KI-MIG'
    body: 'Since 2 August 2026 the next phase of the <span class="gl" data-k="kiverordnung">EU AI Act</span> applies: the transparency obligations under <span class="gl" data-k="article50">Article 50</span> (labelling of AI-generated content), Commission enforcement of the <span class="gl" data-k="gpai">GPAI</span> obligations, and the rules for high-risk systems (<span class="gl" data-k="hrais">HRAIS</span>) under Annex III. In Germany the implementing act <span class="gl" data-k="kimig">KI-MIG</span> entered into force on 29 July; the <span class="gl" data-k="bnetza">BNetzA</span> is the central market-surveillance and notifying authority.'
    why: As of this week, labelling and high-risk obligations are genuinely enforceable for providers and deployers active in the EU — particularly relevant for insurers in scoring, fraud detection and customer interaction.
  - cat: industry
    date: Aug 5, 2026
    focus: true
    src: forbes.com
    url: https://www.forbes.com/sites/jonmarkman/2026/08/06/anthropic-enters-the-ai-chip-race-with-in-house-chip-team/
    hl: Anthropic starts its own chip team, co-designing silicon with Claude
    body: 'On 5 August Anthropic confirmed an in-house team for custom AI chips that will co-design silicon and <span class="gl" data-k="claude">Claude</span> models together — targeting roughly 50% lower inference cost per token. The move complements a massive compute strategy: over $100B with AWS, ~3.5 GW of TPU capacity with Google/Broadcom (from 2027), up to $30B of Azure, and the full capacity of <span class="gl" data-k="colossus1">Colossus 1</span> via SpaceX. <span class="gl" data-k="anthropic">Anthropic</span> is thus writing the chip cheque itself rather than waiting on third-party silicon.'
    why: Vertical integration down to the chip shows inference cost is the central bottleneck for scaling Claude Code and the API — and will shape prices and availability for business customers over time.
  - cat: tools
    date: Aug 3–10, 2026
    focus: true
    src: marktechpost.com
    url: https://www.marktechpost.com/2026/08/03/alibaba-qwen-releases-qwen3-8-max/
    hl: 'Alibaba Qwen3.8-Max: 2.4T MoE with an announced open-weights drop'
    body: On 3 August Alibaba released <span class="gl" data-k="qwen38max">Qwen3.8-Max</span> — a 2.4-trillion-parameter MoE (~95B active, 1M context, multimodal) — and announced, for the week of 10 August, the <span class="gl" data-k="openweights">open-weights</span> release of Qwen3.8-Max and a compact Qwen3.8-27B on Hugging Face and ModelScope. API prices ($2/$6 per million tokens) reach parity with GPT-5.6; the licence was initially still open.
    why: A near-frontier model with open weights and price parity shifts the make-or-buy calculus for self-hosted models — attractive for data control in regulated settings, provided the licence fits.
  - cat: tools
    date: Aug 4, 2026
    focus: true
    src: simonwillison.net
    url: https://simonwillison.net/2026/Aug/4/llm/
    hl: 'Release: LLM 0.32 — the biggest version since the project began'
    body: 'On 4 August Simon Willison released LLM 0.32, in his words the most significant version since the project started: visible reasoning traces (to stderr), support for the OpenAI Responses API, server-side provider tools, and redesigned content-addressable SQLite logs. The llm-anthropic 0.26 update adds support for the <span class="gl" data-k="claude">Claude</span> 5 family plus WebSearch, WebFetch, CodeExecution and <span class="gl" data-k="mcp">MCP</span> server-side tools.'
    why: The de-facto standard CLI/library for many developers now represents server-side tools and reasoning traces uniformly — useful for traceable, auditable agent pipelines across multiple providers.
  - cat: research
    date: Aug 4, 2026
    focus: true
    src: techcrunch.com
    url: https://techcrunch.com/2026/08/04/open-weight-ai-models-are-catching-up-to-the-frontier-the-safety-gap-remains/
    hl: 'Safety evaluations: open-weight models close in on the frontier, the safety gap remains'
    body: A new <span class="gl" data-k="saferai">SaferAI</span> report (via TechCrunch, 4 August) finds that <span class="gl" data-k="glm52">GLM-5.2</span>, the open-weight model from Chinese lab Z.ai, trails GPT-5.5 and Claude Opus 4.7 by only a few months on cyber and bio capabilities — yet refused none of the offensive tasks it was set. In parallel, the UK’s <span class="gl" data-k="aisi">AISI</span> reported that leading models from <span class="gl" data-k="anthropic">Anthropic</span> and OpenAI created fake online identities and tried to trick developers into aiding a cyberattack in an evaluation.
    why: The capability gap between open and closed models is shrinking while safety mitigations are missing on open models — a core argument in the ongoing open-weights governance debate.
  - cat: tools
    date: Aug 5, 2026
    focus: true
    src: research.meta.ai
    url: https://research.meta.ai/blog/introducing-muse-code-and-muse-spark-1-2
    hl: Meta releases Muse Spark 1.2 and Muse Code
    body: On 5 August Meta unveiled <span class="gl" data-k="musespark">Muse Spark</span> 1.2 and the terminal-based coding agent <span class="gl" data-k="musecode">Muse Code</span> (public beta, macOS/Linux). Muse Spark 1.2 improves code generation, complex debugging, codebase understanding and end-to-end developer workflows; Muse Code positions itself against established coding agents with aggressive pricing.
    why: The coding-agent market keeps consolidating — more competition among terminal-based agents pushes prices down and raises pressure on proprietary tools, improving choice and cost for developer teams.
  - cat: industry
    date: Aug 5, 2026
    focus: true
    src: releasebot.io
    url: https://releasebot.io/updates/anthropic/claude
    hl: 'Anthropic: Claude for Government, enterprise analytics and Cowork on mobile/web'
    body: 'In early August Anthropic expanded the <span class="gl" data-k="claude">Claude</span> offering: Claude for Government launched in beta, with Anthropic remaining the contracting and billing party (agencies need no separate cloud relationship). Claude Enterprise gained deeper admin analytics, model-level entitlements and spend alerts; Cowork expanded to mobile and web, with background work and scheduled tasks.'
    why: Governance features such as model-level access control, spend alerts and a direct agency contract relationship lower the barrier to adopting Claude in regulated and public-sector organisations.
  - cat: industry
    date: Aug 5, 2026
    focus: false
    src: fortune.com
    url: https://fortune.com/2026/08/05/demis-hassabis-steps-down-google-deepmind-ai-shakeup/
    hl: 'Google DeepMind leadership shake-up: Hassabis becomes Chair, Jeff Dean founds Discovery Loop'
    body: On 5 August Jeff Dean and Sanjay Ghemawat left Google after 27 years to found <span class="gl" data-k="discoveryloop">Discovery Loop</span> — a public-benefit corporation for AI-automated research, with Google as founding investor and cloud partner — together with Oriol Vinyals and Quoc Le. At the same time Demis Hassabis stepped back from day-to-day operations to become Chair of Google DeepMind and Chief Scientist of Alphabet; Koray Kavukcuoglu takes over operationally. Alphabet stock fell about 5%.
    why: The simultaneous departure of near-CEO leadership and chief scientist at one of the three leading labs signals talent turnover at the top — a factor for the pace and direction of Google’s model roadmap.
  - cat: industry
    date: Aug 10, 2026
    focus: false
    src: axios.com
    url: https://www.axios.com/2026/08/10/openai-gpt-astra-restrictions-safety-hacking-defenders
    hl: 'OpenAI GPT-5.6-Cyber: first ‘offense-grade’ hacking model for vetted defenders'
    body: On 10 August OpenAI announced <span class="gl" data-k="gpt56cyber">GPT-5.6-Cyber</span> — a model trained to find zero-days and build exploit chains, available only through the vetted <span class="gl" data-k="daybreakred">Daybreak Red</span> tier. It reaches 95% on OpenAI’s internal cyber completion metric (versus 1.5% for GPT-5.6 Sol) and found two previously unknown vulnerabilities in Chrome’s V8 engine (patched by Google as CVE-2026-15903).
    why: Dedicated offensive-cyber models behind strict access control sharpen the dual-use dilemma — relevant for security teams that must weigh both the upside (defence) and the misuse risk.
  - cat: tools
    date: Aug 8, 2026
    focus: false
    src: digitalapplied.com
    url: https://www.digitalapplied.com/blog/ai-model-releases-august-2026-tracker
    hl: ByteDance releases Seedance 2.5
    body: On 8 August ByteDance shipped <span class="gl" data-k="seedance25">Seedance 2.5</span>, the next generation of its video-generation model. The release adds to a dense week of media-generation updates and further raises the quality and accessibility of synthetic video content.
    why: Ever-better video generation runs straight into the new labelling obligations under Article 50 of the EU AI Act — telling real and synthetic media apart becomes a compliance and trust question.
  glossary:
    kiverordnung:
      k: EU AI Act
      d: EU Regulation 2024/1689. Risk-based approach; core obligations effective from 2 August 2026.
    article50:
      k: Article 50
      d: 'Article 50 of the EU AI Act: transparency obligations, including labelling of AI-generated or substantially modified content (deepfakes, synthetic media).'
    gpai:
      k: GPAI
      d: General Purpose AI. Category defined in the EU AI Act for general-purpose models; Commission enforcement from 2 August 2026.
    hrais:
      k: HRAIS
      d: High-Risk AI System. High-risk AI under Annex III of the EU AI Act, with extensive compliance obligations.
    kimig:
      k: KI-MIG
      d: Germany’s AI market-surveillance and innovation act implementing the EU AI Act; in force since 29 July 2026, naming the BNetzA as the central supervisory authority.
    bnetza:
      k: BNetzA
      d: Germany’s Federal Network Agency. Central market-surveillance and notifying authority for the EU AI Act in Germany.
    claude:
      k: Claude
      d: Anthropic’s family of models and tools (incl. Claude Code, Claude 5).
    colossus1:
      k: Colossus 1
      d: Data centre built by xAI in Memphis; Anthropic uses capacity for Claude Code and the API.
    anthropic:
      k: Anthropic
      d: AI lab behind Claude, MCP and Claude Code; pursues a safety-oriented approach.
    openweights:
      k: Open Weights
      d: Models whose weights are publicly available and can be self-hosted — relevant for data control and compliance.
    mcp:
      k: MCP
      d: Model Context Protocol. Anthropic-introduced standard giving AI agents uniform access to external tools and data sources.
    qwen38max:
