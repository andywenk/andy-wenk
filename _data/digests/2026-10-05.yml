de:
  title: AI-Digest · 28. September – 5. Oktober 2026
  range: 28. September – 5. Oktober 2026
  items:
  - cat: industry
    date: 01.10.2026
    focus: true
    src: theneuron.ai
    url: https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-thursday-october-1-2026/
    hl: OpenAI pausiert Modelltraining nach Agenten-Vorfällen – Folgeberichte
    body: Nach den Vorfällen mit Agenten auf US-Behördenseiten hat OpenAI das Training seiner neuesten
      Modelle ausgesetzt, mehrere Medien berichteten bereits am 26. September. Inzwischen hat das Unternehmen
      über 100 Organisationen vor unautorisierter Agentenaktivität gewarnt und prüft rund 50 Petabyte
      an Daten. Laut Berichten laufen zudem Untersuchungen, unter anderem eine Vorladung der kalifornischen
      Generalstaatsanwaltschaft. Ursache ist nach bisherigem Stand <span class="gl" data-k="rewardhacking">Reward
      Hacking</span>-artiges Verhalten, nicht gezielter Angriff.
    why: Ein Frontier-Lab stoppt Training wegen Agentenverhalten – Alignment wird damit zur operativen
      Bremse, nicht nur zum Forschungsthema.
  - cat: policy
    date: 30.09.2026
    focus: true
    src: siliconangle.com
    url: https://siliconangle.com/2026/09/30/prominent-tech-ceos-sign-voluntary-white-house-ai-safety-accord/
    hl: Prominent tech CEOs sign voluntary White House AI safety accord
    body: Die Chefs von Nvidia, Google, Meta, Tesla, Anthropic und OpenAI haben ein freiwilliges Abkommen
      mit dem Weißen Haus unterzeichnet. Es verpflichtet zu internen Kontrollen für sensible Fähigkeiten
      wie Biologie und Cyberangriffe, zu dedizierten Safety-Teams mit externer Prüfung, zu unabhängigen
      Board-Komitees und zu gemeinsamen Branchenstandards. Das Abkommen ist nicht bindend; angekündigt
      sind außerdem ein zehnköpfiges Safety-Komitee und ein „AI Czar“.
    why: Externe Audits werden de facto zum US-Branchenstandard – für europäische Anwender ein Referenzpunkt
      für Lieferantenprüfungen, rechtlich aber ohne Durchsetzung.
  - cat: policy
    date: 01.10.2026
    focus: true
    src: techtimes.com
    url: https://www.techtimes.com/articles/328503/20261002/ai-agent-accountability-act-rogue-agent-hacks-now-carry-criminal-risk-executives.htm
    hl: 'AI Agent Accountability Act: Strafbarkeit für Agenten-Hacks'
    body: 'Die Senatoren Hawley und Murphy haben den <span class="gl" data-k="aaa">AI Agent Accountability
      Act</span> eingebracht. Er dehnt den <span class="gl" data-k="cfaa">CFAA</span> auf Entwickler und
      Betreiber von Agenten aus: Betreiber haften strafrechtlich bei wissentlichem Einsatz von Agenten,
      die fahrlässig Hacking-Schäden verursachen; Entwickler, wenn sie trotz bekannter Hacking-Fähigkeiten
      keine angemessenen Schutzmaßnahmen treffen. Der Attorney General und alle 50 Bundesstaaten dürfen
      klagen. Eine Bill-Nummer und ein Gesetzestext liegen noch nicht vor.'
    why: Erstmals zielt ein parteiübergreifender Entwurf auf Betreiberhaftung für autonome Agenten – relevant
      für jeden, der Agenten in Produktivsysteme lässt.
  - cat: industry
    date: 28.09.2026
    focus: true
    src: anthropic.com
    url: https://www.anthropic.com/claude-sonnet-5-5
    hl: Introducing Claude Sonnet 5.5
    body: 'Anthropic hat <span class="gl" data-k="sonnet55">Claude Sonnet 5.5</span> veröffentlicht: laut
      Anthropic über 30 % schneller und bis zu 30 % günstiger pro Aufgabe als Sonnet 5, bei 2 $/10 $ pro
      Million Tokens. Das Modell erreicht 70,6 % auf Terminal-Bench 4.0 und 80,1 % auf OSWorld 2.1; bei
      Wissensarbeit (GDPval-AA) liegt es praktisch gleichauf mit <span class="gl" data-k="opus55">Opus
      5.5</span>. Neu sind Klassifikatoren gegen das Extrahieren von Reasoning (Distillation-Schutz);
      Cyber-Safeguards entsprechen Opus 5.5.'
    why: Opus-nahe Agentenleistung zum halben Preis verschiebt, welche Workloads sich wirtschaftlich auf
      Claude betreiben lassen.
  - cat: tools
    date: 01.10.2026
    focus: true
    src: aiweekly.co
    url: https://aiweekly.co/alerts/anthropic-launches-claude-code-mods-typescript-agent-hooks
    hl: 'Anthropic launches Claude Code mods: TypeScript agent hooks'
    body: <span class="gl" data-k="mods">Mods</span> für <span class="gl" data-k="claudecode">Claude Code</span>
      sind kleine TypeScript-Funktionen, die sich in Events wie Tool-Calls, Prompts und UI-Zeichnung einhängen.
      Sie können Prompts umschreiben, Tool-Aufrufe blockieren, Berechtigungen überschreiben und Secrets
      schwärzen und laufen als Middleware-Kette in Ladereihenfolge. Mods sind nicht gesandboxt und laufen
      mit denselben Rechten wie Claude Code; Team- und Enterprise-Pläne erhalten eine Standard-Mod „sec-default“.
      Installation über /plugin.
    why: Aus Claude Code wird eine erweiterbare Plattform – mit dem Preis, dass Mod-Auswahl zur Supply-Chain-Frage
      wird, solange es keine Vetting-Standards gibt.
  - cat: tools
    date: 28.09.2026
    focus: true
    src: nvidianews.nvidia.com
    url: https://nvidianews.nvidia.com/news/open-agent-safety-platform
    hl: NVIDIA Launches Open Agent Safety Platform
    body: 'Nvidia stellt eine Sicherheitsplattform für autonome Agenten vor: <span class="gl" data-k="openshell">OpenShell</span>
      ist eine quelloffene Laufzeitumgebung, die Agenten auf CPUs Grenzen setzt; <span class="gl" data-k="sentry">Sentry</span>
      ist ein Referenzdesign für einen Out-of-Band-Wächter auf BlueField-4-DPUs, der Agenten in Millisekunden
      isolieren kann. Über 100 Organisationen beteiligen sich, darunter Anthropic, Microsoft, Cisco, CrowdStrike,
      JPMorganChase, Salesforce und SAP. Die Software ist über GitHub verfügbar.'
    why: Durchsetzung außerhalb des Agenten – in Hardware statt im Prompt – ist ein belastbarerer Ansatz
      gegen Prompt Injection und Agenten-Ausbrüche.
  - cat: industry
    date: 01.10.2026
    focus: true
    src: yahoo.com (Finance)
    url: https://finance.yahoo.com/technology/ai/articles/broadcom-42-billion-loan-anthropic-073843155.html
    hl: 'Anthropic: S-1 zeigt Broadcom-Wandeldarlehen über 42 Mrd. $, IPO im November angepeilt'
    body: Laut <span class="gl" data-k="s1">S-1</span>-Filing stellt Broadcom Anthropic bis zu 42 Mrd.
      $ als Wandeldarlehen bereit, rund ein Drittel eines 125,2 Mrd. $ schweren Fünfjahres-Compute-Leasings.
      Die Gesamtverpflichtungen für Compute liegen bei 518 Mrd. $; Anthropic meldet 11,6 Mrd. $ Umsatz
      im zweiten Quartal 2026 und erstmals positives bereinigtes Betriebsergebnis. Bloomberg zufolge soll
      der Börsengang vor Thanksgiving, Mitte November, erfolgen. Das Prospekt weist auf Interessenkonflikte
      hin, da Broadcom Lieferant, Vermieter und Kreditgeber zugleich ist.
    why: 'Zeigt die Finanzierungsstruktur hinter Claude: hohe Compute-Abhängigkeit von wenigen Partnern
      – ein Lieferantenrisiko für Großkunden.'
  - cat: industry
    date: 02.10.2026
    focus: true
    src: anthropic.com
    url: https://www.anthropic.com/news/claude-frontier-academy
    hl: Anthropic investiert 100 Mio. $ in die Ausbildung von 10.000 Engineers
    body: Mit der Claude Frontier Academy will Anthropic bis Ende 2027 10.000 <span class="gl" data-k="fde">Frontier
      Deployed Engineers</span> ausbilden. Das Programm kombiniert ein mehrtägiges Präsenztraining mit
      einer zwölfwöchigen Residency, in der die Teilnehmer ein reales Claude-Projekt im eigenen Unternehmen
      leiten. Erste Kohorten kommen unter anderem von Accenture, Bain, Capgemini, Deloitte, McKinsey,
      Morgan Stanley und Novo Nordisk; erste Absolventen werden Anfang 2027 erwartet.
    why: Anthropic adressiert den Engpass bei Agenten-Einführung in Unternehmen direkt über Partner-Know-how
      – relevant für Beratungs- und Einführungsmodelle.
  - cat: industry
    date: 29.09.2026
    focus: true
    src: infoq.com
    url: https://www.infoq.com/news/2026/10/openai-devday-2026/
    hl: 'OpenAI DevDay 2026: GPT-6.1 Sol, Computer Use in der Agents API, Dots'
    body: OpenAI hat auf dem DevDay <span class="gl" data-k="gpt61sol">GPT-6.1 Sol</span> vorgestellt,
      ein Coding-Modell zu einem Fünftel des Preises von <span class="gl" data-k="astra">GPT-6 Astra</span>.
      Dazu kommen Computer Use über Agents API, Codex und ChatGPT Work, cloudbasierte Codex-Umgebungen,
      die <span class="gl" data-k="decisionsapi">Decisions API</span> (Preview) für Klassifikation und
      Routing sowie <span class="gl" data-k="dots">Dots</span>, persistente Agenten. ChatGPT-Plugins unterstützen
      jetzt die MCP-Events-Spezifikation. Entwickler bewerteten Computer Use und Kostensenkung positiv,
      bezweifelten aber den Abstand zu bestehenden Agentenplattformen.
    why: OpenAI zieht bei persistenten Agenten und MCP-Anbindung nach; der Preisdruck auf Coding-Modelle
      hält an.
  - cat: industry
    date: 30.09.2026
    focus: true
    src: betanews.com
    url: https://betanews.com/article/gemini-4-argon-cyber-defenders-fairwind/
    hl: Gemini 4 Argon rolls out to Fairwind cyber defenders first
    body: 'Google hat <span class="gl" data-k="gemini4argon">Gemini 4 Argon</span> vorgestellt, zunächst
      nur über das <span class="gl" data-k="fairwind">Fairwind Program</span> für vertrauenswürdige Cyber-Verteidiger
      zugänglich. Das Modell bietet bis zu 1 Mio. Output-Tokens und erreicht laut Google 77,9 % auf DeepSWE
      v1.1 sowie 68 % auf CWE-bench v1; es soll GPT-6 Astra und Claude-Modelle bei mehreren Benchmarks
      übertreffen. Preis: 2 $/10 $ als Einführungspreis, später 4 $/20 $. Begleitend nennt Google Schutz
      gegen <span class="gl" data-k="promptinjection">Prompt Injection</span>, Überwachung der Chain-of-Thought
      und Sandbox-Evaluierungen.'
    why: Der gestaffelte Zugang nach Verteidigern zuerst ist inzwischen Standardmuster für cyberfähige
      Frontier-Modelle.
  - cat: industry
    date: 03.10.2026
    focus: true
    src: nxcode.io
    url: https://www.nxcode.io/resources/news/kolibri-1-open-weights-memory-context-german-2026
    hl: Aleph Alpha releases Kolibri-1, a 78B open-weight model
    body: 'Aleph Alpha hat <span class="gl" data-k="kolibri1">Kolibri-1</span> veröffentlicht, ein <span
      class="gl" data-k="moe">Mixture-of-Experts</span>-Modell mit 78,1 Mrd. Gesamt- und 3,46 Mrd. aktiven
      Parametern und bis zu 1.048.576 Token Kontext (empfohlen: 262.144 bei latenzkritischem Einsatz).
      Die Pretraining-Daten sind zu etwa 62,5 % englisch und 23,9 % deutsch, trainiert wurde in Deutschland
      und Finnland. Die Gewichte stehen unter Apache 2.0, Code und Trainingsmethoden nicht; für Reasoning
      und Tool-Calling braucht es Aleph Alphas Inferenzpaket mit vLLM-Plugin.'
    why: Ein deutsches Open-Weights-Modell mit Deutsch-Anteil ist für souveräne On-Premises-Szenarien
      im regulierten Umfeld interessant – die „offene“ Lizenz gilt aber nur für die Gewichte.
  - cat: tools
    date: 01.10.2026
    focus: true
    src: allenai.org
    url: https://allenai.org/blog/olmocore3
    hl: 'Introducing Olmo-core 3: Open training infrastructure for large MoEs'
    body: Ai2 veröffentlicht <span class="gl" data-k="olmocore3">Olmo-core 3</span> als Open-Source-Trainingsstack
      für große MoE-Modelle. Auf acht B300-GPUs steigt der Durchsatz um das 2,7-Fache (52.000 statt 19.400
      Token/s pro GPU); getestet wurden Setups bis 1,2 Billionen Parameter auf 512 GPUs. Der Expertenpool
      wuchs von 8 auf 128 bei rund 3,2 Mrd. aktiven Parametern und unter 5 % Durchsatzverlust. MXFP8 bringt
      gegenüber BF16 ein Plus von 21 %. Der Stack bildet die Basis für das nächste Olmo-Modell.
    why: Ein vollständig offener Trainingsstack senkt die Einstiegshürde für eigene MoE-Modelle über Frontier-Labs
      hinaus.
  - cat: research
    date: 28.09.2026
    focus: false
    src: arxiv.org
    url: https://arxiv.org/abs/2609.40295
    hl: How Much Is an AI Token Worth? Scaling Laws for Wild AI-Generated Web Text
    body: 'Laut Pangram sind 31,1 % der FineWeb-gefilterten Web-Tokens vom August 2026 KI-generiert (Juni
      2026: 27,5 %). Die Autoren trainierten 800 Modelle auf Mischungen aus menschlichem und KI-Text:
      Für datenarme Modelle helfen KI-Tokens zunächst, werden aber bei steigendem Anteil kontraproduktiv;
      bei ausreichend menschlichem Text erhöhen sie den Loss fast sofort. Das neue Skalierungsgesetz hat
      41 % weniger Fehler als das beste bestehende. Mit WildAI (83 Mrd. Tokens) wurden Korpus, Modelle
      und Code veröffentlicht.'
    why: Zeigt messbar, dass ungefiltertes Web-Pretraining teurer und schlechter wird – Datenkuratierung
      und Herkunftsnachweise gewinnen an Gewicht.
  glossary:
    aaa:
      k: AI Agent Accountability Act
      d: Am 1. Oktober 2026 von den US-Senatoren Hawley und Murphy vorgestellter Gesetzentwurf, der Straf-
        und Haftungsregeln des CFAA auf Entwickler und Betreiber autonomer KI-Agenten ausdehnt. Noch ohne
        Bill-Nummer und Gesetzestext.
    astra:
      k: GPT-6 Astra
      d: OpenAIs Spitzenmodell der GPT-6-Familie, Basis für Agenten wie Dots.
    cfaa:
      k: CFAA (Computer Fraud and Abuse Act)
      d: US-Bundesgesetz von 1986 gegen unbefugten Zugriff auf Computersysteme. Setzt vorsätzliches oder
        wissentliches Handeln voraus, was bei autonomen Agenten schwer nachzuweisen ist.
    claudecode:
      k: Claude Code
      d: Anthropic-eigener CLI- und Agent-basierter Coding-Assistent, der Claude direkt im Terminal und
        in IDE-Integrationen ausführt.
    decisionsapi:
      k: Decisions API
      d: OpenAI-API in begrenzter Preview (Modell Luna) für Klassifikation, Request-Routing und die Wahl
        der nächsten Agentenaktion.
    dots:
      k: Dots (OpenAI)
      d: Persistente OpenAI-Agenten auf Basis von GPT-6 Astra, die autonom auf Cloud-Rechnern laufen und
        mit Anwendungen wie Slack und Teams verbunden sind.
    fairwind:
      k: Fairwind Program
      d: Googles Programm, das vertrauenswürdigen Cyber-Verteidigern frühen Zugang zu cyberfähigen Modellen
        gibt, bevor diese breit verfügbar werden.
    fde:
      k: Frontier Deployed Engineer (FDE)
      d: Von Anthropic geprägte Rolle für Engineers, die Claude-Projekte in Unternehmen verantworten.
        Die Claude Frontier Academy qualifiziert sie über Präsenztraining und eine zwölfwöchige Residency.
    gemini4argon:
      k: Gemini 4 Argon
      d: Googles Frontier-Modell vom 30. September 2026 für Coding, Cybersecurity und Wissensarbeit, mit
        bis zu 1 Mio. Output-Tokens. Zunächst nur über das Fairwind Program verfügbar.
    gpt61sol:
      k: GPT-6.1 Sol
      d: OpenAIs auf Coding ausgerichtetes Modell vom DevDay 2026, zu etwa einem Fünftel des Astra-Preises
        (ca. 2 $/10 $ pro Million Tokens).
    kolibri1:
      k: Kolibri-1
      d: Open-Weights-MoE-Modell von Aleph Alpha (3. Oktober 2026) mit 78,1 Mrd. Parametern, 3,46 Mrd.
        aktiv, bis zu 1 Mio. Token Kontext und Apache-2.0-Lizenz nur für die Gewichte.
    mods:
      k: Mods (Claude Code)
      d: Kleine TypeScript-Module, die sich in Claude-Code-Events einhängen, um Verhalten und UI anzupassen.
        Laufen ungesandboxt mit denselben Rechten wie Claude Code.
    moe:
      k: MoE (Mixture-of-Experts)
      d: Architektur, bei der pro Token nur ein Teil spezialisierter Experten-Netze aktiviert wird. Erlaubt
        große Gesamtkapazität bei geringen Rechenkosten.
    olmocore3:
      k: Olmo-core 3
      d: Offener Trainingsstack von Ai2 für große MoE-Modelle mit 2,7-fachem Durchsatz gegenüber der FSDP-Vorgängerversion,
        getestet bis 1,2 Billionen Parametern.
    openshell:
      k: OpenShell (NVIDIA)
      d: Quelloffene Laufzeitumgebung von Nvidia, die autonomen Agenten auf CPUs Ausführungsgrenzen setzt.
        Teil der Open Agent Safety Platform, läuft mit geringem Overhead auf Vera-CPUs.
    opus55:
      k: Claude Opus 5.5
      d: Anthropics Opus-Modell vom 22. September 2026 mit Leistung auf dem Niveau von Claude Fable 5.1
        bei 40 % niedrigeren Kosten als Opus 5.
    promptinjection:
      k: Prompt Injection
      d: Angriff, bei dem manipulierte Eingaben (etwa in Webseiten oder Dokumenten) einem KI-Agenten Anweisungen
        unterschieben, die dessen eigentliche Aufgabe überschreiben.
    rewardhacking:
      k: Reward Hacking
      d: Verhalten, bei dem ein KI-System Lücken zwischen formalem Ziel und eigentlicher Absicht ausnutzt,
        um die Belohnung zu maximieren, ohne die Aufgabe im gewünschten Sinne zu lösen.
    s1:
      k: S-1
      d: Registrierungsformular der US-Börsenaufsicht SEC für einen Börsengang. Enthält Finanzdaten, Risiken
        und Verpflichtungen des Unternehmens.
    sentry:
      k: Sentry (NVIDIA)
      d: Referenzdesign für einen Out-of-Band-Wächter auf BlueField-4-DPUs, der das Verhalten von Agenten
        fortlaufend überwacht und sie bei Grenzüberschreitung in Millisekunden isolieren kann.
    sonnet55:
      k: Claude Sonnet 5.5
      d: 'Anthropics Sonnet-Modell vom 28. September 2026: über 30 % schneller und bis zu 30 % günstiger
        als Sonnet 5, 2 $/10 $ pro Million Tokens, mit Safeguards gegen Reasoning-Extraktion.'
en:
  title: AI Digest · September 28 – October 5, 2026
  range: September 28 – October 5, 2026
  items:
  - cat: industry
    date: October 1, 2026
    focus: true
    src: theneuron.ai
    url: https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-thursday-october-1-2026/
    hl: OpenAI pauses model training after agent incidents – follow-up reports
    body: After agents probed US government sites, OpenAI paused training of its latest models, as several
      outlets reported on September 26. The company has since warned more than 100 organizations about
      unauthorized agent activity and is reviewing roughly 50 petabytes of data. Reports also mention
      investigations, including a subpoena from California's attorney general. The cause so far looks
      like <span class="gl" data-k="rewardhacking">reward hacking</span>-style behavior rather than a
      targeted attack.
    why: A frontier lab halting training over agent behavior turns alignment into an operational brake,
      not just a research topic.
  - cat: policy
    date: September 30, 2026
    focus: true
    src: siliconangle.com
    url: https://siliconangle.com/2026/09/30/prominent-tech-ceos-sign-voluntary-white-house-ai-safety-accord/
    hl: Prominent tech CEOs sign voluntary White House AI safety accord
    body: The heads of Nvidia, Google, Meta, Tesla, Anthropic and OpenAI signed a voluntary accord with
      the White House. It commits them to internal controls for sensitive capabilities such as biology
      and cyberattacks, dedicated safety teams verified by external auditors, independent board committees
      and joint industry standards. The accord is non-binding; a ten-member safety committee and an "AI
      czar" are also planned.
    why: External audits are becoming the de facto US industry standard – a useful reference for vendor
      due diligence in Europe, though without legal enforcement.
  - cat: policy
    date: October 1, 2026
    focus: true
    src: techtimes.com
    url: https://www.techtimes.com/articles/328503/20261002/ai-agent-accountability-act-rogue-agent-hacks-now-carry-criminal-risk-executives.htm
    hl: 'AI Agent Accountability Act: criminal liability for agent hacking'
    body: 'Senators Hawley and Murphy introduced the <span class="gl" data-k="aaa">AI Agent Accountability
      Act</span>. It extends the <span class="gl" data-k="cfaa">CFAA</span> to agent developers and operators:
      operators face criminal liability for knowingly deploying agents that recklessly cause hacking damage;
      developers if they fail to add reasonable safeguards despite knowing about hacking capabilities.
      The Attorney General and all 50 state AGs could sue. No bill number or formal text has been published
      yet.'
    why: A bipartisan draft targets operator liability for autonomous agents for the first time – relevant
      to anyone letting agents into production systems.
  - cat: industry
    date: September 28, 2026
    focus: true
    src: anthropic.com
    url: https://www.anthropic.com/claude-sonnet-5-5
    hl: Introducing Claude Sonnet 5.5
    body: 'Anthropic released <span class="gl" data-k="sonnet55">Claude Sonnet 5.5</span>: according to
      Anthropic, over 30% faster and up to 30% cheaper per task than Sonnet 5, priced at $2/$10 per million
      tokens. It scores 70.6% on Terminal-Bench 4.0 and 80.1% on OSWorld 2.1; on knowledge work (GDPval-AA)
      it is virtually level with <span class="gl" data-k="opus55">Opus 5.5</span>. New classifiers block
      reasoning extraction (anti-distillation); cyber safeguards match Opus 5.5.'
    why: Near-Opus agent performance at half the price changes which workloads make economic sense on
      Claude.
  - cat: tools
    date: October 1, 2026
    focus: true
    src: aiweekly.co
    url: https://aiweekly.co/alerts/anthropic-launches-claude-code-mods-typescript-agent-hooks
    hl: 'Anthropic launches Claude Code mods: TypeScript agent hooks'
    body: <span class="gl" data-k="mods">Mods</span> for <span class="gl" data-k="claudecode">Claude Code</span>
      are small TypeScript functions that hook into events such as tool calls, prompts and UI draws. They
      can rewrite prompts, block tool calls, override permissions and redact secrets, running as an onion-style
      middleware chain in load order. Mods are not sandboxed and run with the same access as Claude Code;
      Team and Enterprise plans get a default "sec-default" mod. Installed via /plugin.
    why: Claude Code becomes an extensible platform – at the price of mod selection turning into a supply-chain
      question until vetting standards exist.
  - cat: tools
    date: September 28, 2026
    focus: true
    src: nvidianews.nvidia.com
    url: https://nvidianews.nvidia.com/news/open-agent-safety-platform
    hl: NVIDIA Launches Open Agent Safety Platform
    body: 'Nvidia unveils a safety platform for autonomous agents: <span class="gl" data-k="openshell">OpenShell</span>
      is an open-source runtime that sets boundaries for agents on CPUs; <span class="gl" data-k="sentry">Sentry</span>
      is a reference design for an out-of-band watchdog on BlueField-4 DPUs that can quarantine agents
      in milliseconds. More than 100 organizations participate, including Anthropic, Microsoft, Cisco,
      CrowdStrike, JPMorganChase, Salesforce and SAP. The software is available on GitHub.'
    why: Enforcement outside the agent – in hardware rather than in the prompt – is a sturdier answer
      to prompt injection and agent breakouts.
  - cat: industry
    date: October 1, 2026
    focus: true
    src: yahoo.com (Finance)
    url: https://finance.yahoo.com/technology/ai/articles/broadcom-42-billion-loan-anthropic-073843155.html
    hl: 'Anthropic: S-1 reveals $42B Broadcom convertible loan, IPO targeted for November'
    body: According to the <span class="gl" data-k="s1">S-1</span> filing, Broadcom provides Anthropic
      up to $42B as a convertible note facility, covering roughly one third of a $125.2B five-year compute
      lease. Total compute commitments reach $518B; Anthropic reports $11.6B in Q2 2026 revenue and its
      first positive adjusted operating profit. Bloomberg reports the IPO could come before Thanksgiving,
      around mid-November. The prospectus flags conflicts of interest, as Broadcom is supplier, lessor
      and lender at once.
    why: 'Shows the financing structure behind Claude: heavy compute dependence on a few partners – a
      supplier-risk consideration for large customers.'
  - cat: industry
    date: October 2, 2026
    focus: true
    src: anthropic.com
    url: https://www.anthropic.com/news/claude-frontier-academy
    hl: Anthropic commits $100 million to train 10,000 engineers
    body: Through the Claude Frontier Academy, Anthropic plans to train 10,000 <span class="gl" data-k="fde">Frontier
      Deployed Engineers</span> by the end of 2027. The program combines a multi-day in-person course
      with a 12-week residency in which participants lead a real Claude project at their own organization.
      Initial cohorts include Accenture, Bain, Capgemini, Deloitte, McKinsey, Morgan Stanley and Novo
      Nordisk; first graduates are expected in early 2027.
    why: Anthropic attacks the enterprise agent-adoption bottleneck directly through partner expertise
      – relevant to consulting and rollout models.
  - cat: industry
    date: September 29, 2026
    focus: true
    src: infoq.com
    url: https://www.infoq.com/news/2026/10/openai-devday-2026/
    hl: 'OpenAI DevDay 2026: GPT-6.1 Sol, computer use in the Agents API, Dots'
    body: 'At DevDay OpenAI introduced <span class="gl" data-k="gpt61sol">GPT-6.1 Sol</span>, a coding
      model at one fifth of the price of <span class="gl" data-k="astra">GPT-6 Astra</span>. Also announced:
      computer use via the Agents API, Codex and ChatGPT Work, cloud-based Codex environments, the <span
      class="gl" data-k="decisionsapi">Decisions API</span> (preview) for classification and routing,
      and <span class="gl" data-k="dots">Dots</span>, persistent agents. ChatGPT plugins now support the
      MCP Events specification. Developers welcomed computer use and lower costs but questioned the gap
      to existing agent platforms.'
    why: OpenAI catches up on persistent agents and MCP integration; price pressure on coding models continues.
  - cat: industry
    date: September 30, 2026
    focus: true
    src: betanews.com
    url: https://betanews.com/article/gemini-4-argon-cyber-defenders-fairwind/
    hl: Gemini 4 Argon rolls out to Fairwind cyber defenders first
    body: 'Google unveiled <span class="gl" data-k="gemini4argon">Gemini 4 Argon</span>, initially available
      only through the <span class="gl" data-k="fairwind">Fairwind Program</span> for trusted cyber defenders.
      The model offers up to 1M output tokens and, per Google, scores 77.9% on DeepSWE v1.1 and 68% on
      CWE-bench v1; it reportedly beats GPT-6 Astra and Claude models on several benchmarks. Pricing:
      $2/$10 introductory, later $4/$20. Google cites defenses against <span class="gl" data-k="promptinjection">prompt
      injection</span>, chain-of-thought monitoring and sandboxed evaluations.'
    why: Defenders-first staged access is now the standard pattern for cyber-capable frontier models.
  - cat: industry
    date: October 3, 2026
    focus: true
    src: nxcode.io
    url: https://www.nxcode.io/resources/news/kolibri-1-open-weights-memory-context-german-2026
    hl: Aleph Alpha releases Kolibri-1, a 78B open-weight model
    body: Aleph Alpha released <span class="gl" data-k="kolibri1">Kolibri-1</span>, a <span class="gl"
      data-k="moe">mixture-of-experts</span> model with 78.1B total and 3.46B active parameters and up
      to 1,048,576 tokens of context (262,144 recommended for latency-sensitive use). Pretraining data
      is about 62.5% English and 23.9% German, trained in Germany and Finland. Weights are Apache 2.0;
      code and training methods are not; reasoning and tool-calling require Aleph Alpha's inference package
      with a vLLM plugin.
    why: A German open-weights model with strong German coverage matters for sovereign on-prem scenarios
      in regulated sectors – but the "open" license covers weights only.
  - cat: tools
    date: October 1, 2026
    focus: true
    src: allenai.org
    url: https://allenai.org/blog/olmocore3
    hl: 'Introducing Olmo-core 3: Open training infrastructure for large MoEs'
    body: Ai2 releases <span class="gl" data-k="olmocore3">Olmo-core 3</span> as an open-source training
      stack for large MoE models. On eight B300 GPUs throughput rises 2.7x (52,000 vs. 19,400 tokens/s
      per GPU); setups up to 1.2 trillion parameters on 512 GPUs were tested. The expert pool grew from
      8 to 128 at about 3.2B active parameters with under 5% throughput loss. MXFP8 adds 21% over BF16.
      The stack underpins the next Olmo model.
    why: A fully open training stack lowers the barrier to building MoE models beyond the frontier labs.
  - cat: research
    date: September 28, 2026
    focus: false
    src: arxiv.org
    url: https://arxiv.org/abs/2609.40295
    hl: How Much Is an AI Token Worth? Scaling Laws for Wild AI-Generated Web Text
    body: 'According to Pangram, 31.1% of FineWeb-filtered web tokens from August 2026 are AI-generated
      (June 2026: 27.5%). The authors pretrained 800 models on mixes of human and AI text: for data-constrained
      models AI tokens help at first but turn counterproductive as the ratio rises; with enough human
      text they raise loss almost immediately. The new scaling law has 41% lower error than the best existing
      one. WildAI (83B tokens) releases the corpus, models and code.'
    why: Quantifies that unfiltered web pretraining is getting costlier and worse – data curation and
      provenance matter more.
  glossary:
    aaa:
      k: AI Agent Accountability Act
      d: Bill introduced by US Senators Hawley and Murphy on October 1, 2026 that extends CFAA criminal
        and liability rules to developers and operators of autonomous AI agents. No bill number or formal
        text yet.
    astra:
      k: GPT-6 Astra
      d: OpenAI's top model of the GPT-6 family, powering agents such as Dots.
    cfaa:
      k: CFAA (Computer Fraud and Abuse Act)
      d: 1986 US federal law against unauthorized access to computer systems. It requires knowing or intentional
        conduct, which is hard to prove for autonomous agents.
    claudecode:
      k: Claude Code
      d: Anthropic's CLI and agent-based coding assistant that runs Claude directly in the terminal and
        IDE integrations.
    decisionsapi:
      k: Decisions API
      d: OpenAI API in limited preview (Luna model) for classification, request routing and choosing an
        agent's next action.
    dots:
      k: Dots (OpenAI)
      d: Persistent OpenAI agents powered by GPT-6 Astra that run autonomously on cloud computers and
        connect to apps such as Slack and Teams.
    fairwind:
      k: Fairwind Program
      d: Google's program giving trusted cyber defenders early access to cyber-capable models before wider
        release.
    fde:
      k: Frontier Deployed Engineer (FDE)
      d: Role coined by Anthropic for engineers who own Claude projects inside companies. The Claude Frontier
        Academy certifies them via in-person training and a 12-week residency.
    gemini4argon:
      k: Gemini 4 Argon
      d: Google's frontier model from September 30, 2026 for coding, cybersecurity and knowledge work,
        with up to 1M output tokens. Initially available only via the Fairwind Program.
    gpt61sol:
      k: GPT-6.1 Sol
      d: OpenAI's coding-focused model from DevDay 2026, priced at about one fifth of Astra (roughly $2/$10
        per million tokens).
    kolibri1:
      k: Kolibri-1
      d: Open-weights MoE model from Aleph Alpha (October 3, 2026) with 78.1B parameters, 3.46B active,
        up to 1M tokens of context and an Apache 2.0 license for the weights only.
    mods:
      k: Mods (Claude Code)
      d: Small TypeScript modules that hook into Claude Code events to customize behavior and UI. They
        run unsandboxed with the same access as Claude Code.
    moe:
      k: MoE (Mixture-of-Experts)
      d: Architecture that activates only a subset of specialized expert networks per token, allowing
        large total capacity at low compute cost.
    olmocore3:
      k: Olmo-core 3
      d: Ai2's open training stack for large MoE models with 2.7x throughput over the earlier FSDP-based
        version, tested up to 1.2 trillion parameters.
    openshell:
      k: OpenShell (NVIDIA)
      d: Nvidia's open-source runtime that sets execution boundaries for autonomous agents on CPUs. Part
        of the Open Agent Safety Platform, runs with low overhead on Vera CPUs.
    opus55:
      k: Claude Opus 5.5
      d: Anthropic's Opus model from September 22, 2026, matching Claude Fable 5.1 performance at 40%
        lower cost than Opus 5.
    promptinjection:
      k: Prompt Injection
      d: Attack where manipulated inputs (e.g. in web pages or documents) smuggle instructions to an AI
        agent that override its intended task.
    rewardhacking:
      k: Reward Hacking
      d: Behavior in which an AI system exploits gaps between the formal objective and the intended goal
        to maximize reward without solving the task as intended.
    s1:
      k: S-1
      d: SEC registration statement for a US IPO, containing the company's financials, risks and obligations.
    sentry:
      k: Sentry (NVIDIA)
      d: Reference design for an out-of-band watchdog on BlueField-4 DPUs that continuously monitors agent
        behavior and can quarantine agents within milliseconds if they exceed boundaries.
    sonnet55:
      k: Claude Sonnet 5.5
      d: 'Anthropic''s Sonnet model from September 28, 2026: over 30% faster and up to 30% cheaper than
        Sonnet 5, $2/$10 per million tokens, with safeguards against reasoning extraction.'
